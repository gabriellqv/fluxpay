name: fluxpay

services:
  database:
    image: postgres:15-alpine
    container_name: fluxpay-db
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: fluxpay
    ports:
      - '5432:5432'
    volumes:
      - fluxpay-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d fluxpay"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: always

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fluxpay-api
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://docker:docker@database:5432/fluxpay?schema=public
      JWT_SECRET: fluxpay_super_secret_jwt_key_2026_docker
      JWT_EXPIRES_IN: 1d
    depends_on:
      database:
        condition: service_healthy
    restart: always

volumes:
  fluxpay-db-data:
