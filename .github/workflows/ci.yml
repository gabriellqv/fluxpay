name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/fluxpay?schema=public'
      JWT_SECRET: 'ci_jwt_secret_key_for_testing_12345'
      JWT_EXPIRES_IN: '1d'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Prettier Format Check
        run: npm run format:check

      - name: Tests
        run: npm run test
